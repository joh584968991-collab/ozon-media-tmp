<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>杭州乐旅汽车音响商行 · 门头招牌方案 v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;900&family=Space+Grotesk:wght@500;700&display=swap');
*{box-sizing:border-box}
body{margin:0;padding:28px;background:#0a0a0a;color:#e5e5e5;font-family:'Noto Sans SC',sans-serif}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px;font-weight:900;letter-spacing:2px}
.meta{color:#94a3b8;font-size:13px;margin-bottom:24px}
.meta b{color:#22d3ee}
.card{background:#18181b;border-radius:14px;padding:20px;margin-bottom:22px;border:1px solid #27272a}
.card .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.card h2{margin:0;font-size:18px;font-weight:900;letter-spacing:2px}
.card h2.v1{color:#0891b2}
.card h2.v2{color:#22d3ee}
.card h2.v3{color:#f59e0b}
.card .tag{font-size:12px;color:#a1a1aa;background:#27272a;padding:3px 10px;border-radius:99px}
.card .desc{color:#a1a1aa;font-size:13px;margin:0 0 14px}
.svg-frame{background:#f5f5f5;border-radius:10px;overflow:hidden}
.svg-frame img{display:block;width:100%;height:auto}
.change{background:#1c1917;border-left:3px solid #22d3ee;padding:10px 14px;border-radius:4px;font-size:12px;color:#d4d4d8;margin-top:18px;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
<h1>杭州乐旅汽车音响商行 · 门头招牌方案</h1>
<div class="meta">规格 <b>9000mm × 1960mm</b> · 风格 <b>现代简约科技</b> · 矢量 SVG</div>

<div class="card">
<div class="head"><h2 class="v1">V1 · 简约科技（浅色）</h2><span class="tag">白墙外立面</span></div>
<p class="desc">白底 + 深蓝字 + 青色点缀</p>
<div class="svg-frame"><img src="v1-light-minimalist.svg" alt="V1"></div>
</div>

<div class="card">
<div class="head"><h2 class="v2">V2 · 深空科技（暗色）</h2><span class="tag">夜间亮眼</span></div>
<p class="desc">深蓝渐变 + 青色 LED 风</p>
<div class="svg-frame"><img src="v2-deep-space.svg" alt="V2"></div>
</div>

<div class="card">
<div class="head"><h2 class="v3">V3 · 动感汽配（炭灰）</h2><span class="tag">汽配城气质</span></div>
<p class="desc">炭灰底 + 琥珀红 LED 风</p>
<div class="svg-frame"><img src="v3-aggressive-auto.svg" alt="V3"></div>
</div>

<div class="change">
<b style="color:#22d3ee">↻ 本次排版调整：</b><br>
字间距收紧（店名 20→10、英文 18→8、副标 8→4、产品列表 6→3、电话 15→8）<br>
上下行距放宽（副标/标语/产品列表各下移 50–90mm，版式更舒展）
</div>

</div>
</body>
</html>
